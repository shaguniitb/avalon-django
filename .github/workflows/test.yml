name: Avalon E2E Tests

# This tells GitHub to run the tests every time you push or open a pull request
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Grab your code from the GitHub repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up a Python environment (adjust version if you use something else)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' 
        cache: 'pip' # Caches your dependencies to make future runs much faster!

    # 3. Install both your production and testing dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    # 4. Download the actual browser engines for Playwright
    # The --with-deps flag installs necessary Linux system libraries for the browsers
    - name: Install Playwright Browsers
      run: playwright install --with-deps

    # 5. Run your test suite!
    - name: Run Pytest
      env:
        # We need to provide dummy environment variables so Django's settings.py doesn't crash
        DJANGO_SECRET_KEY: 'test-secret-key-do-not-use-in-production'
        DEBUG: 'True'
      run: |
        python -m pytest
