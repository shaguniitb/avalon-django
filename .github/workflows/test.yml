name: Avalon E2E Tests

# This tells GitHub to run the tests every time you push or open a pull request
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Fixes the Node.js 20 deprecation warnings by forcing Node 24 execution
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: avalon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    # 1. Grab your code from the GitHub repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up a Python environment (adjust version if you use something else)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' 
        cache: 'pip' # Caches your dependencies to make future runs much faster!

    # 3. Install both your production and testing dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    # 4. Download the actual browser engines for Playwright
    # The --with-deps flag installs necessary Linux system libraries for the browsers
    - name: Install Playwright Browsers
      run: playwright install --with-deps

    # 5. Run your test suite!
    - name: Run Pytest
      env:
        # We need to provide dummy environment variables so Django's settings.py doesn't crash
        DJANGO_SECRET_KEY: 'test-secret-key-do-not-use-in-production'
        DEBUG: 'True'
        DATABASE_URL: 'postgres://testuser:testpassword@localhost:5432/avalon_test'
      run: |
        python -m pytest
