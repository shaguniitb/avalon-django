<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Avalon{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}bg-light{% endblock %}">

    {% block content %}
    {% endblock %}

    {% block footer %}
    <footer class="container text-center py-4 mt-5 border-top">
        <p class="mb-0 small text-muted">
            Created by <a href="https://shagunjhaver.com/" target="_blank" class="text-decoration-none fw-semibold">Shagun Jhaver</a> 
            <span class="mx-2 text-secondary">|</span> 
            <i class="bi bi-unlock-fill text-success me-1"></i>Open-Source <a href="https://github.com/shaguniitb/avalon-django" target="_blank" class="text-decoration-none fw-semibold">Code for site</a>
        </p>
    </footer>
    {% endblock %}

    {% block extra_scripts %}{% endblock %}

</body>
</html>
