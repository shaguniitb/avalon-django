<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Avalon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        
        /* Mobile-responsive card sizing */
        .auth-card { max-width: 400px; width: 100%; }
        
        /* Automatically style Django's raw form inputs */
        form p { margin-bottom: 1rem; }
        form label { font-weight: 500; margin-bottom: 0.25rem; display: block; color: #495057; }
        form input { 
            width: 100%; padding: 0.6rem 0.75rem; 
            border: 1px solid #ced4da; border-radius: 0.375rem; 
            background-color: #fff; font-size: 1rem; transition: border-color .15s ease-in-out;
        }
        form input:focus {
            border-color: #86b7fe; outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        
        /* Style Django errors/help text */
        .helptext { font-size: 0.8rem; color: #6c757d; display: block; margin-top: 4px; }
        .errorlist { font-size: 0.85rem; color: #dc3545; list-style: none; padding-left: 0; margin-top: 0.25rem; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="card auth-card shadow-sm border-0 mx-3">
        <div class="card-body p-4 p-md-5">
            
            <div class="text-center mb-4">
                <h1 class="display-6 fw-bold text-dark mb-3" style="letter-spacing: 2px;">AVALON</h1>
                <!-- <h2 class="fw-bold mb-1">Welcome Back</h2> -->
                <p class="text-muted">Sign in to play Avalon</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                
                <button type="submit" class="btn btn-primary w-100 btn-lg mt-3 fw-bold">
                    Login
                </button>
            </form>
            
            <div class="text-center mt-4 pt-3 border-top">
                <p class="text-muted mb-1">Don't have an account?</p>
                <a href="{% url 'register' %}" class="text-decoration-none fw-bold">Sign up here</a>
            </div>
            
        </div>
    </div>

</body>
</html>
